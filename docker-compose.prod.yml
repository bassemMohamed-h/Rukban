services:
  backend:
    build:
      context: .
      target: production
    container_name: respct_backend_prod
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
    env_file:
      - .env.production
    networks:
      - respct_prod_network
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', (r) => {if(r.statusCode !== 200) throw new Error()})"]
      interval: 30s
      timeout: 10s
      retries: 3

  mongodb:
    image: mongo:7.0
    container_name: respct_mongodb_prod
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
    env_file:
      - .env.production
    volumes:
      - mongodb_prod_data:/data/db
      - ./mongodb-prod.conf:/etc/mongod.conf:ro
    networks:
      - respct_prod_network
    restart: always
    command: ["mongod", "--config", "/etc/mongod.conf"]

networks:
  respct_prod_network:
    driver: bridge

volumes:
  mongodb_prod_data: